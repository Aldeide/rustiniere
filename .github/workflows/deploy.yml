name: Build Rustinière Desktop App

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install root and client dependencies
        run: |
          npm ci || npm install
          cd client
          npm ci || npm install
          cd ..

      - name: Build client UI
        run: npm run build

      - name: Build Desktop Executable
        run: npx electron-builder --win portable nsis

      - name: Upload Windows Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rustiniere-Windows-Build
          path: dist-desktop/*.*
